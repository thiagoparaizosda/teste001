{% extends "base.html" %}

{% set hide_navbar = true %}

{% block title %}{{ titulo }}{% endblock %}

{% block extra_css %}

<style>
    .login-container {
        padding: 2rem;
        max-width: 500px;
        margin: 2rem auto;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        padding: 2rem;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-title {
        color: #2c3e50;
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .login-subtitle {
        color: #7f8c8d;
        font-size: 1rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        color: #2c3e50;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .form-control {
        border-radius: 8px;
        padding: 0.8rem;
        border: 1px solid #e1e1e1;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.25);
        border-color: #3498db;
    }

    .login-btn {
        background: linear-gradient(to right, #3498db, #2980b9);
        border: none;
        color: white;
        padding: 1rem;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.3s ease;
        width: 100%;
        margin-bottom: 1rem;
    }

    .login-btn:hover {
        background: linear-gradient(to right, #2980b9, #3498db);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    }

    .portal-icon {
        font-size: 48px;
        color: #3498db;
        margin-bottom: 1rem;
    }

    .input-group {
        position: relative;
    }

    .input-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #95a5a6;
        z-index: 10;
        cursor: pointer;
    }
    
    .forgot-password {
        text-align: center;
        margin-top: 0.5rem;
    }
    
    .forgot-password a {
        color: #3498db;
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.3s ease;
    }
    
    .forgot-password a:hover {
        color: #2980b9;
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-laptop-code portal-icon"></i>
            <h1 class="login-title">Portal de Análises PPSA</h1>
            <p class="login-subtitle">Faça login para continuar</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="email" name="email" 
                           placeholder="Seu e-mail corporativo" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Sua senha" required>
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt me-2"></i>
                Entrar
            </button>
            
            
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    // Mostrar/ocultar senha
    $(document).ready(function() {
        $('.input-icon.fa-lock').click(function() {
            const passwordInput = $('#password');
            const icon = $(this);
            
            if (passwordInput.attr('type') === 'password') {
                passwordInput.attr('type', 'text');
                icon.removeClass('fa-lock').addClass('fa-lock-open');
            } else {
                passwordInput.attr('type', 'password');
                icon.removeClass('fa-lock-open').addClass('fa-lock');
            }
        });
    });
</script>
{% endblock %}
